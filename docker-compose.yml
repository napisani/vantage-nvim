version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint:
      /bin/sh -c "
      ollama serve &
      sleep 2 &&
      ollama pull codegemma:2b &&
      ollama pull embeddinggemma:300m &&
      ollama pull qwen2.5-coder:0.5b &&
      wait
      "

volumes:
  ollama_data:
