layout:
  sort_process_list_running_first: true
  sort_process_list_alpha: true

procs:
  typecheck:
    cmd: ["npm", "run", "typecheck"]
    cwd: "."
    description: "Typecheck the pi-vantage-nvim extension and the test host."
    categories: ["check", "typescript"]

  lint:
    cmd: ["npm", "run", "lint"]
    cwd: "."
    description: "Run oxlint over the extension and the test host."
    categories: ["check"]

  "test:ext":
    cmd: ["npm", "run", "test:ext"]
    cwd: "."
    description: "Run the extension's node:test specs."
    categories: ["test", "extension"]

  "test:nvim":
    cmd: ["npm", "run", "test:nvim"]
    cwd: "."
    description: "Run the headless Neovim suite against the real extension."
    categories: ["test", "nvim"]

  check:
    cmd: ["npm", "run", "check"]
    cwd: "."
    autostart: true
    autofocus: true
    description: "Typecheck, lint and run every test."
    categories: ["check", "test"]

  "build:plugin":
    cmd: ["npm", "run", "build:plugin"]
    cwd: "."
    description: "Build the dist plugin package."
    categories: ["build"]
